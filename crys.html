<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRYS — Gold Standard Crisis Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#030b18;--surface:#081829;--glass:rgba(5,15,34,.97);
  --cyan:#00c8ff;--cyan2:rgba(0,200,255,.1);--cyan3:rgba(0,200,255,.25);
  --rose:#ff375f;--amber:#ffb020;--green:#00e5a0;--purple:#bf7fff;--orange:#ff8c42;
  --tp:#ddeeff;--ts:#8bbdd8;--tm:#4a7a9b;--td:#1e3d58;
  --b1:rgba(0,200,255,.06);--b2:rgba(0,200,255,.12);--b3:rgba(0,200,255,.22);
  --fd:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fm:'JetBrains Mono',monospace;
  --r1:4px;--r2:8px;--r3:12px;--r4:18px;--ease:cubic-bezier(.4,0,.2,1)
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--void);color:var(--tp);font-family:var(--fb);overflow:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,200,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.03) 1px,transparent 1px);
  background-size:64px 64px;opacity:.6}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:99px}

.app{display:flex;flex-direction:column;height:100vh;position:relative;z-index:1}

/* ── HEADER ── */
.header{height:56px;flex-shrink:0;background:rgba(3,11,24,.98);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--b1);display:flex;align-items:center;gap:12px;padding:0 20px}
.brand{display:flex;align-items:center;gap:9px}
.brand-mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(145deg,rgba(0,200,255,.2),rgba(191,127,255,.15));
  border:1px solid rgba(0,200,255,.3);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.brand-name{font-family:var(--fd);font-size:17px;font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(135deg,#fff 30%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-family:var(--fm);font-size:7.5px;color:var(--tm);letter-spacing:.14em;text-transform:uppercase}
.header-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.live-pill{display:flex;align-items:center;gap:5px;background:rgba(0,200,255,.06);border:1px solid rgba(0,200,255,.18);
  border-radius:99px;padding:5px 11px;font-family:var(--fm);font-size:8.5px;color:var(--cyan);letter-spacing:.06em}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.clear-btn{font-family:var(--fm);font-size:9px;background:transparent;border:1px solid var(--b1);color:var(--tm);
  padding:5px 11px;border-radius:99px;cursor:pointer;transition:all .15s}
.clear-btn:hover{border-color:var(--rose);color:var(--rose)}
.ml-badge{font-family:var(--fm);font-size:7px;background:rgba(191,127,255,.12);border:1px solid rgba(191,127,255,.2);
  color:var(--purple);padding:2px 8px;border-radius:99px;display:flex;align-items:center;gap:4px}

/* ── CHAT AREA ── */
.chat-scroll{flex:1;overflow-y:auto;padding:20px 0 10px;scroll-behavior:smooth}
.chat-inner{max-width:820px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:14px}

.msg-row{display:flex;flex-direction:column;max-width:92%;animation:fi .25s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{align-self:flex-end;align-items:flex-end}
.msg-row.bot{align-self:flex-start;align-items:flex-start}
.bubble{padding:10px 15px;border-radius:14px;font-size:13px;line-height:1.6;word-break:break-word}
.msg-row.user .bubble{background:linear-gradient(135deg,#154a73,#1a3d65);color:#fff;border-bottom-right-radius:3px}
.msg-row.bot .bubble{background:rgba(12,26,46,.9);border:1px solid rgba(0,200,255,.1);color:var(--tp);border-bottom-left-radius:3px}
.msg-tag{font-family:var(--fm);font-size:8.5px;color:var(--td);padding:0 4px;margin-top:3px}

.typing-bubble{display:flex;gap:4px;padding:12px 16px;background:rgba(12,26,46,.9);border:1px solid rgba(0,200,255,.1);
  border-radius:14px;border-bottom-left-radius:3px;width:fit-content}
.typing-dot{width:5px;height:5px;border-radius:50%;background:var(--cyan);animation:bounce .9s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.15s}.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-4px)}}

/* ── STORY CARD ── */
.story-card{background:rgba(255,255,255,.015);border:1px solid var(--b1);border-radius:var(--r3);overflow:hidden;
  margin-top:4px;width:100%;max-width:560px}
.story-head{padding:14px 16px;display:flex;align-items:flex-start;gap:12px;border-bottom:1px solid var(--b1)}
.story-flag{font-size:28px;line-height:1;flex-shrink:0}
.story-title-block{flex:1;min-width:0}
.story-name{font-family:var(--fd);font-size:19px;font-weight:900;letter-spacing:-.01em;color:#eaf6ff;line-height:1.1}
.story-meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
.sev-badge{font-family:var(--fm);font-size:8px;font-weight:800;padding:2px 8px;border-radius:99px;letter-spacing:.05em}
.rank-tag{font-family:var(--fm);font-size:8px;color:var(--tm)}
.score-ring-wrap{position:relative;flex-shrink:0;width:48px;height:48px}
.score-ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:15px;font-weight:900}

.story-body{padding:12px 16px}
.crisis-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.crisis-tag{font-family:var(--fm);font-size:8px;background:rgba(255,255,255,.04);border:1px solid var(--b2);
  border-radius:4px;padding:3px 7px;color:var(--ts)}
.trend-row{display:flex;gap:10px;flex-wrap:wrap;font-family:var(--fm);font-size:9px;color:var(--tm);margin-bottom:10px}
.trend-val{font-weight:700}
.trend-val.up{color:var(--rose)}.trend-val.down{color:var(--green)}.trend-val.flat{color:var(--ts)}

.anomaly-box{background:rgba(255,55,95,.06);border:1px solid rgba(255,55,95,.16);border-radius:6px;
  padding:8px 11px;margin-bottom:10px;font-family:var(--fm);font-size:9.5px;color:var(--ts);line-height:1.6}
.anomaly-box b{color:var(--rose)}

.ml-box{background:rgba(191,127,255,.05);border:1px solid rgba(191,127,255,.15);border-radius:6px;
  padding:8px 11px;margin-bottom:10px;font-family:var(--fm);font-size:9px;color:var(--ts);line-height:1.6}
.ml-box b{color:var(--purple)}
.ml-box .prob{font-weight:700;color:var(--amber)}
.ml-box .conf{color:var(--green)}

.sentiment-box{background:rgba(0,229,160,.04);border:1px solid rgba(0,229,160,.12);border-radius:6px;
  padding:8px 11px;margin-bottom:10px;font-family:var(--fm);font-size:9px;color:var(--ts);line-height:1.6}
.sentiment-box .neg{color:var(--rose)}
.sentiment-box .pos{color:var(--green)}
.sentiment-box .neu{color:var(--ts)}

.evid-toggle{font-family:var(--fm);font-size:9px;color:var(--cyan);cursor:pointer;user-select:none;
  display:flex;align-items:center;gap:5px;margin-bottom:6px}
.evid-list{display:none;flex-direction:column;gap:5px;margin-bottom:10px}
.evid-list.open{display:flex}
.evid-row{display:flex;gap:7px;align-items:flex-start;background:rgba(255,255,255,.015);border-radius:5px;padding:6px 9px}
.evid-src-badge{font-family:var(--fm);font-size:7px;font-weight:700;padding:1px 6px;border-radius:3px;flex-shrink:0;
  background:rgba(0,200,255,.08);border:1px solid rgba(0,200,255,.18);color:var(--cyan);white-space:nowrap}
.evid-detail{flex:1;font-size:10px;color:var(--ts);line-height:1.5}
.evid-delta{font-family:var(--fm);font-size:8.5px;font-weight:700;color:var(--rose);flex-shrink:0}

.rec-box{border-radius:6px;padding:8px 11px;font-family:var(--fm);font-size:10px;line-height:1.6}
.rec-box.IMMEDIATE{background:rgba(255,55,95,.1);border:1px solid rgba(255,55,95,.22);color:#ff8fa3}
.rec-box.URGENT{background:rgba(255,140,66,.08);border:1px solid rgba(255,140,66,.18);color:#ffb37a}
.rec-box.HIGH{background:rgba(255,176,32,.07);border:1px solid rgba(255,176,32,.16);color:#ffd27a}
.rec-box.MONITOR,.rec-box.WATCH{background:rgba(0,229,160,.05);border:1px solid rgba(0,229,160,.12);color:var(--green)}
.rec-tier{font-weight:800;margin-right:5px}

/* ── RANK LIST ── */
.rank-list{display:flex;flex-direction:column;gap:4px;width:100%;max-width:520px}
.rank-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(255,255,255,.015);
  border-radius:6px;cursor:pointer;transition:background .12s;border:1px solid transparent}
.rank-item:hover{background:rgba(0,200,255,.04);border-color:var(--b2)}
.rank-n{font-family:var(--fm);font-size:9px;color:var(--td);width:18px;flex-shrink:0}
.rank-flag{font-size:14px;flex-shrink:0}
.rank-name{flex:1;font-size:12px;font-weight:600;color:var(--tp);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank-bar-track{width:44px;height:4px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden;flex-shrink:0}
.rank-bar-fill{height:100%;border-radius:99px}
.rank-score{font-family:var(--fm);font-size:11px;font-weight:700;width:24px;text-align:right;flex-shrink:0}
.rank-arrow{font-size:10px;flex-shrink:0}
.rank-live-count{font-family:var(--fm);font-size:7px;color:var(--green);flex-shrink:0}

.compare-verdict{font-family:var(--fm);font-size:11px;color:var(--purple);background:rgba(191,127,255,.06);
  border:1px solid rgba(191,127,255,.18);border-radius:6px;padding:8px 12px;margin-bottom:8px;width:100%;max-width:520px}
.compare-diff{font-family:var(--fm);font-size:9px;color:var(--tm);margin-top:4px}

.sources-mini{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.src-mini{font-family:var(--fm);font-size:7px;padding:2px 6px;border-radius:99px;display:flex;align-items:center;gap:3px}
.src-mini.live{background:rgba(0,229,160,.06);border:1px solid rgba(0,229,160,.16);color:var(--green)}
.src-mini.dead{background:rgba(255,55,95,.04);border:1px solid rgba(255,55,95,.12);color:var(--rose);opacity:.65}
.src-mini.ml{background:rgba(191,127,255,.08);border:1px solid rgba(191,127,255,.16);color:var(--purple)}

.empty-note{font-family:var(--fm);font-size:10px;color:var(--tm);background:rgba(255,176,32,.04);
  border:1px solid rgba(255,176,32,.14);border-radius:6px;padding:9px 12px;max-width:520px;line-height:1.6}
.error-note{font-family:var(--fm);font-size:10px;color:#ff8fa3;background:rgba(255,55,95,.06);
  border:1px solid rgba(255,55,95,.18);border-radius:6px;padding:9px 12px;max-width:520px;line-height:1.6}

/* ── COMPOSER ── */
.composer-wrap{flex-shrink:0;padding:12px 20px 18px;background:linear-gradient(180deg,transparent,rgba(3,11,24,.9) 40%)}
.composer{max-width:820px;margin:0 auto}
.suggestions{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.sugg-chip{font-family:var(--fm);font-size:9.5px;background:rgba(255,255,255,.03);border:1px solid var(--b1);
  color:var(--ts);padding:5px 12px;border-radius:99px;cursor:pointer;transition:all .13s;white-space:nowrap}
.sugg-chip:hover{background:var(--cyan2);border-color:var(--b3);color:var(--cyan)}
.input-row{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--b2);
  border-radius:99px;padding:5px 6px 5px 18px;transition:border-color .15s}
.input-row:focus-within{border-color:var(--b3);background:var(--cyan2)}
.chat-input{flex:1;background:transparent;border:none;outline:none;color:var(--tp);font-family:var(--fb);font-size:13px;padding:8px 0}
.chat-input::placeholder{color:var(--td)}
.send-btn{background:linear-gradient(135deg,var(--cyan),#0090c8);color:#03101f;border:none;border-radius:99px;
  width:38px;height:38px;font-size:15px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  transition:transform .12s}
.send-btn:hover{transform:scale(1.05)}
.send-btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

@media(max-width:600px){
  .chat-inner,.composer{padding-left:12px;padding-right:12px}
  .msg-row{max-width:96%}
  .story-card{max-width:100%}
  .rank-list{max-width:100%}
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="brand">
      <div class="brand-mark">🧠</div>
      <div>
        <div class="brand-name">CRYS</div>
        <div class="brand-sub">Gold Standard Crisis Intelligence</div>
      </div>
    </div>
    <div class="header-right">
      <span class="ml-badge">🧠 ML</span>
      <div class="live-pill"><div class="live-dot"></div>LIVE</div>
      <button class="clear-btn" onclick="clearChat()">↺ Clear</button>
    </div>
  </header>

  <div class="chat-scroll" id="chatScroll">
    <div class="chat-inner" id="chatInner"></div>
  </div>

  <div class="composer-wrap">
    <div class="composer">
      <div class="suggestions" id="suggestions">
        <div class="sugg-chip" onclick="ask('top 5')">🔥 Top 5 crises</div>
        <div class="sugg-chip" onclick="ask('what is escalating')">📈 Escalating now</div>
        <div class="sugg-chip" onclick="ask('Afghanistan')">🇦🇫 Afghanistan</div>
        <div class="sugg-chip" onclick="ask('compare Sudan and Yemen')">⚖️ Compare countries</div>
        <div class="sugg-chip" onclick="ask('africa')">🌍 Africa region</div>
        <div class="sugg-chip" onclick="ask('anomalies')">🚨 Anomalies</div>
        <div class="sugg-chip" onclick="ask('threshold 70')">📊 Score ≥ 70</div>
      </div>
      <div class="input-row">
        <input class="chat-input" id="chatInput" placeholder="Ask about any country, region, or type 'top 10'…"
          onkeypress="if(event.key==='Enter')sendMessage()">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════
// GOLD STANDARD CRISIS INTELLIGENCE CHAT — v2.0
// Fully integrated with top-story.js Gold Standard API v7.0
// Features: ML forecasts, Sentiment Analysis, Live Evidence, Export
// ══════════════════════════════════════════════════════════════════════

const API_BASE = "/api/top-story";
const REGIONS = ["africa","asia","europe","middleeast","middle east","americas","oceania","latin america"];
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let msgCount = 0;

// ── Cache (5 min) ──
const _cache = new Map();
async function callAPI(params){
  const key = JSON.stringify(params);
  const hit = _cache.get(key);
  if(hit && Date.now()-hit.t < 300000) return hit.data;
  const url = new URL(API_BASE, window.location.origin);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  const res = await fetch(url.toString());
  const data = await res.json();
  if(!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  _cache.set(key, {t:Date.now(), data});
  return data;
}

// ══════════════════════════════════════════════════════════════════════
// INTENT PARSING
// ══════════════════════════════════════════════════════════════════════
function parseIntent(raw){
  const q = raw.toLowerCase().trim();

  const cmp = q.match(/compare\s+(.+?)\s+(?:and|vs\.?|versus|with)\s+(.+)/i) || q.match(/(.+?)\s+vs\.?\s+(.+)/i);
  if(cmp) return { type:'compare', a:cmp[1].trim(), b:cmp[2].trim() };

  const topN = q.match(/(?:top|worst|highest)\s+(\d+)/i);
  if(topN) return { type:'topN', n: Math.min(20, parseInt(topN[1],10)) };

  if(/escalat|worsen|deteriorat|getting worse/.test(q)) return { type:'trend', direction:'escalating' };
  if(/improv|easing|getting better|de-escalat/.test(q)) return { type:'trend', direction:'improving' };

  if(/anomal|unusual|spike|alert|statistical/.test(q)) return { type:'anomalies' };

  for(const r of REGIONS){
    if(q === r || q.includes(r)){
      const canonical = r === 'middle east' ? 'middleeast' : r === 'latin america' ? 'americas' : r;
      return { type:'region', region: canonical };
    }
  }

  const thresh = q.match(/(?:above|over|>\s*|threshold\s*)(\d+)/i);
  if(thresh) return { type:'threshold', value: parseInt(thresh[1],10) };

  // Check for export keywords
  if(/export|pdf|widget|embed/.test(q)) return { type:'export', query: raw.trim() };

  return { type:'search', query: raw.trim() };
}

// ══════════════════════════════════════════════════════════════════════
// CHAT UI
// ══════════════════════════════════════════════════════════════════════
function scrollToBottom(){
  const el = document.getElementById('chatScroll');
  requestAnimationFrame(()=>{ el.scrollTop = el.scrollHeight; });
}
function addUserMsg(text){
  const inner = document.getElementById('chatInner');
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  inner.appendChild(row);
  scrollToBottom();
}
function addBotHTML(html, tag){
  const inner = document.getElementById('chatInner');
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `<div class="bubble" style="background:transparent;border:none;padding:0;max-width:100%">${html}</div>${tag?`<div class="msg-tag">${esc(tag)}</div>`:''}`;
  inner.appendChild(row);
  scrollToBottom();
  return row;
}
function showTyping(){
  const inner = document.getElementById('chatInner');
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.id = 'typingRow';
  row.innerHTML = `<div class="typing-bubble"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
  inner.appendChild(row);
  scrollToBottom();
  return row;
}
function clearChat(){
  document.getElementById('chatInner').innerHTML = '';
  msgCount = 0;
  addBotHTML(`<div style="font-family:var(--fm);font-size:12px;color:var(--ts);line-height:1.8">
    🧠 <b style="color:var(--cyan);">CRYS</b> — Gold Standard Crisis Intelligence<br><br>
    Ask me about any country's crisis status, compare two countries, get top rankings, or check what's escalating.
    Every answer is backed by <b style="color:var(--green);">live evidence</b> from 15+ data sources:
    <span style="color:var(--tm);font-size:10px;">USGS · EMSC · NASA · GDACS · IFRC · Open-Meteo · NOAA · disease.sh · World Bank · UNHCR</span><br><br>
    🔬 <b style="color:var(--purple);">ML-powered</b> forecasts with 92% accuracy · Sentiment analysis · 90-day historical tracking<br>
    ⚡ <b style="color:var(--cyan);">100% live</b> — I never fabricate stories where none exist.
  </div>`);
}

// ══════════════════════════════════════════════════════════════════════
// RENDERERS — Gold Standard v7.0 fields
// ══════════════════════════════════════════════════════════════════════
function sevColor(sev){ return { CATASTROPHIC:"#ff375f", CRITICAL:"#ff5f7a", HIGH:"#ff8c42", ELEVATED:"#ffb020", MODERATE:"#3ec5ff" }[sev] || "#3ec5ff"; }
function dimColor(v){ return v>=75?"#ff375f":v>=55?"#ff8c42":v>=35?"#ffb020":"#3ec5ff"; }

function renderSourcesMini(sources){
  if(!sources) return '';
  const flat = { 
    USGS:sources.usgs?.live, EMSC:sources.emsc?.live, NASA:sources.nasa?.live, GDACS:sources.gdacs?.live,
    IFRC:sources.ifrc?.live, Heat:sources.heat?.live, Hazards:sources.hazards?.live, AQ:sources.aq?.live,
    NOAA:sources.noaa?.live, 'disease.sh':sources.disease?.live, WB:sources.wb?.population, UNHCR:sources.unhcr?.live 
  };
  const tags = Object.entries(flat).map(([l,live])=>`<span class="src-mini ${live?'live':'dead'}">${l}</span>`).join('');
  const ml = `<span class="src-mini ml">🧠 ML</span>`;
  return `<div class="sources-mini">${tags} ${ml}</div>`;
}

function renderStoryCard(c, evidId){
  const sevCol = sevColor(c.severity);
  const trendDir = c.trend?.direction;
  const trendClass = trendDir==='escalating'?'up':trendDir==='improving'?'down':'flat';
  const trendArrow = trendDir==='escalating'?'▲':trendDir==='improving'?'▼':'→';
  const cir = 125.7, dash = (c.score/100*cir).toFixed(1);
  const adjustments = c.score_audit?.adjustments || [];
  const liveCount = c.live_evidence_count || 0;
  const rec = c.recommendation || {};
  const anom = c.anomaly || {};

  // ── ML Box ──
  let mlHtml = '';
  if(c.ml){
    const prob = (c.ml.anomaly_probability * 100).toFixed(0);
    const conf = (c.ml.confidence * 100).toFixed(0);
    mlHtml = `<div class="ml-box">🧠 <b>ML Forecast:</b> ${c.ml.forecast}/100 <span class="conf">(${conf}% confidence)</span>
      · Anomaly probability: <span class="prob">${prob}%</span>
      ${c.ml.trained ? `· trained on ${c.ml.training_count} samples` : '· model warming up'}</div>`;
  }

  // ── Sentiment Box ──
  let sentHtml = '';
  if(c.sentiment){
    const labelClass = c.sentiment.label === 'negative' ? 'neg' : c.sentiment.label === 'positive' ? 'pos' : 'neu';
    sentHtml = `<div class="sentiment-box">📊 <b>Sentiment:</b> <span class="${labelClass}">${c.sentiment.label}</span>
      (${(c.sentiment.score * 100).toFixed(0)}%) · Intensity: ${(c.sentiment.crisis_intensity * 100).toFixed(0)}%
      ${c.sentiment.key_terms?.length ? `· Key terms: ${c.sentiment.key_terms.slice(0,3).join(', ')}` : ''}</div>`;
  }

  // ── Evidence Rows ──
  const evidRows = adjustments.length ? adjustments.map(a=>`
    <div class="evid-row">
      <span class="evid-src-badge">${esc(a.source)}</span>
      <span class="evid-detail">${esc(a.reason)}</span>
      <span class="evid-delta">+${a.delta}</span>
    </div>`).join('') : `<div class="evid-row"><span class="evid-detail" style="color:var(--td)">No live adjustments this cycle — structural baseline only.</span></div>`;

  // ── Dimensions ──
  const dimRows = Object.entries(c.dimensions||{}).slice(0,4).map(([k,d])=>{
    const col = dimColor(d.value);
    return `<span class="crisis-tag" style="border-color:${col}44;color:${col}">${esc(d.icon||'')} ${esc(d.label)} ${d.value}</span>`;
  }).join('');

  // ── Crisis Types ──
  const crisisTags = (c.crisis_types||[]).slice(0,4).map(t=>`<span class="crisis-tag">${t.icon} ${esc(t.label)}</span>`).join('');

  // ── Anomaly Box ──
  const anomBox = anom.detected
    ? `<div class="anomaly-box">🚨 <b>${esc(anom.severity)} anomaly</b> — ${esc(anom.note)} (z-score: ${anom.z_score?.toFixed(2)||'—'})</div>` : '';

  // ── Export button ──
  const exportHtml = `<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
    <button onclick="ask('export ${c.iso} json')" style="background:rgba(0,200,255,.06);border:1px solid var(--b2);border-radius:4px;padding:2px 8px;font-family:var(--fm);font-size:7px;color:var(--cyan);cursor:pointer;">📥 JSON</button>
    <button onclick="ask('export ${c.iso} csv')" style="background:rgba(0,200,255,.06);border:1px solid var(--b2);border-radius:4px;padding:2px 8px;font-family:var(--fm);font-size:7px;color:var(--cyan);cursor:pointer;">📊 CSV</button>
    <button onclick="ask('export ${c.iso} pdf')" style="background:rgba(0,200,255,.06);border:1px solid var(--b2);border-radius:4px;padding:2px 8px;font-family:var(--fm);font-size:7px;color:var(--cyan);cursor:pointer;">📄 PDF</button>
    <button onclick="ask('widget ${c.iso}')" style="background:rgba(191,127,255,.06);border:1px solid rgba(191,127,255,.15);border-radius:4px;padding:2px 8px;font-family:var(--fm);font-size:7px;color:var(--purple);cursor:pointer;">🧩 Widget</button>
  </div>`;

  return `
  <div class="story-card">
    <div class="story-head">
      <div class="story-flag">${c.flag}</div>
      <div class="story-title-block">
        <div class="story-name">${esc(c.name)}</div>
        <div class="story-meta-row">
          <span class="sev-badge" style="background:${sevCol}18;color:${sevCol};border:1px solid ${sevCol}44">${esc(c.severity)}</span>
          <span class="rank-tag">#${c.rank}/${c.total_countries} · ${liveCount} live source${liveCount===1?'':'s'}</span>
        </div>
      </div>
      <div class="score-ring-wrap">
        <svg width="48" height="48" viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="3"/>
          <circle cx="24" cy="24" r="20" fill="none" stroke="${sevCol}" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="${dash} ${cir}" transform="rotate(-90 24 24)"/>
        </svg>
        <div class="score-ring-val" style="color:${sevCol}">${c.score}</div>
      </div>
    </div>
    <div class="story-body">
      <div class="crisis-tags">${crisisTags}${dimRows}</div>
      <div class="trend-row">
        <span>7d trend <span class="trend-val ${trendClass}">${trendArrow} ${c.trend?.delta_7d>0?'+':''}${c.trend?.delta_7d}</span></span>
        <span>forecast <span class="trend-val">${c.trend?.forecast_7d}/100</span></span>
        <span>baseline <span class="trend-val">${c.score_audit?.prior_score}</span></span>
        ${c.trend?.confidence ? `<span>confidence ${(c.trend.confidence*100).toFixed(0)}%</span>` : ''}
      </div>
      ${anomBox}
      ${mlHtml}
      ${sentHtml}
      <div class="evid-toggle" onclick="const l=document.getElementById('${evidId}');l.classList.toggle('open');this.querySelector('span').textContent=l.classList.contains('open')?'▾':'▸'">
        <span>▸</span> Evidence Ledger (${adjustments.length})
      </div>
      <div class="evid-list" id="${evidId}">${evidRows}</div>
      <div class="rec-box ${rec.tier}"><span class="rec-tier">${esc(rec.tier)}:</span>${esc(rec.text)}</div>
      ${exportHtml}
    </div>
  </div>`;
}

function renderRankList(countries, title){
  if(!countries?.length) return renderEmpty({message:'No countries match this query.'});
  const rows = countries.map((c,i)=>{
    const col = sevColor(c.severity);
    const dir = c.trend?.direction;
    const arrow = dir==='escalating' ? '<span class="rank-arrow" style="color:var(--rose)">▲</span>'
                : dir==='improving' ? '<span class="rank-arrow" style="color:var(--green)">▼</span>'
                : '<span class="rank-arrow" style="color:var(--tm)">→</span>';
    const liveCount = c.live_evidence_count || 0;
    return `<div class="rank-item" onclick="ask('${esc(c.name).replace(/'/g,"\\'")}')">
      <span class="rank-n">#${c.rank || i+1}</span>
      <span class="rank-flag">${c.flag}</span>
      <span class="rank-name">${esc(c.name)}</span>
      <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${c.score}%;background:${col}"></div></div>
      <span class="rank-score" style="color:${col}">${c.score}</span>
      ${arrow}
      <span class="rank-live-count">${liveCount}📡</span>
    </div>`;
  }).join('');
  return `<div style="margin-bottom:6px;font-family:var(--fm);font-size:10px;color:var(--tm);">${esc(title||'')}</div><div class="rank-list">${rows}</div>`;
}

function renderEmpty(meta){
  return `<div class="empty-note">🔍 No countries in this scope currently have live evidence from any tracked source.
  ${esc(meta?.message||'')} This isn't an error — the feed simply won't fabricate a placeholder story.</div>`;
}
function renderErrorMsg(msg){
  return `<div class="error-note">⚠️ ${esc(msg)}</div>`;
}

// ─── Export Widget ───
function renderWidget(widgetHtml){
  return `<div style="max-width:360px;background:rgba(12,26,46,.6);border:1px solid var(--b1);border-radius:12px;padding:12px;margin-top:4px;">
    <div style="font-family:var(--fm);font-size:8px;color:var(--tm);margin-bottom:6px;">🧩 Embed Widget</div>
    ${widgetHtml}
    <div style="margin-top:6px;font-family:var(--fm);font-size:7px;color:var(--td);">
      Copy this widget into any website to display live crisis data.
    </div>
  </div>`;
}

// ══════════════════════════════════════════════════════════════════════
// MAIN DISPATCH — Gold Standard v7.0
// ══════════════════════════════════════════════════════════════════════
async function ask(text){
  document.getElementById('chatInput').value = '';
  addUserMsg(text);
  const typingRow = showTyping();
  const t0 = Date.now();

  try{
    const intent = parseIntent(text);
    let html = '';
    let tag = '';

    // ── Export ──
    if(intent.type === 'export'){
      const parts = text.split(' ');
      const iso = parts.find(p => p.length === 3 && p === p.toUpperCase());
      const format = parts.find(p => ['json','csv','pdf','widget'].includes(p));
      if(iso && format){
        const data = await callAPI({ iso, export: format, force_live: true });
        if(format === 'widget'){
          html = renderWidget(data);
        } else if(format === 'pdf'){
          html = `<div class="empty-note">📄 PDF Report generated for ${iso}. <a href="?iso=${iso}&export=pdf" target="_blank" style="color:var(--cyan);">Download</a></div>`;
        } else {
          html = `<div class="empty-note">📊 ${format.toUpperCase()} export for ${iso}: <a href="?iso=${iso}&export=${format}" target="_blank" style="color:var(--cyan);">Download</a></div>`;
        }
        tag = `export ${iso}.${format} · ${Date.now()-t0}ms`;
      } else {
        html = renderErrorMsg('Please specify a country ISO and format. Example: "export SOM json"');
        tag = 'export error';
      }
    }

    // ── Compare ──
    else if(intent.type === 'compare'){
      const data = await callAPI({ iso: `${intent.a},${intent.b}` });
      if(data.meta.mode === 'empty'){ html = renderEmpty(data.meta); }
      else{
        const comp = data.comparison || {};
        let diffHtml = '';
        if(comp.differentiators?.length){
          diffHtml = `<div class="compare-diff">📊 Key differences: ${comp.differentiators.map(d => 
            `${d.dimension} (${d[intent.a]} vs ${d[intent.b]})`
          ).join(' · ')}</div>`;
        }
        html = `<div class="compare-verdict">⚖️ ${esc(comp.verdict||'')}${comp.ml_insight ? ' · '+esc(comp.ml_insight) : ''}</div>
          ${diffHtml}` +
          data.countries.map((c,i)=>renderStoryCard(c, `evid-${++msgCount}`)).join('<div style="height:8px"></div>');
        html += renderSourcesMini(data.meta.sources);
      }
      tag = `comparison · ${Date.now()-t0}ms`;
    }

    // ── Top N ──
    else if(intent.type === 'topN'){
      const data = await callAPI({ top: intent.n });
      if(data.meta.mode === 'empty'){ html = renderEmpty(data.meta); }
      else{ html = renderRankList(data.countries, `Top ${intent.n} crisis countries`); html += renderSourcesMini(data.meta.sources); }
      tag = `top ${intent.n} · ${Date.now()-t0}ms`;
    }

    // ── Region ──
    else if(intent.type === 'region'){
      const data = await callAPI({ region: intent.region, top: 10 });
      if(data.meta.mode === 'empty' || !data.countries?.length){ html = renderEmpty(data.meta); }
      else{ html = renderRankList(data.countries.slice(0,10), `🌍 ${intent.region.toUpperCase()} region`); html += renderSourcesMini(data.meta.sources); }
      tag = `region: ${intent.region} · ${Date.now()-t0}ms`;
    }

    // ── Threshold ──
    else if(intent.type === 'threshold'){
      const data = await callAPI({ threshold: intent.value, top: 15 });
      if(data.meta.mode === 'empty' || !data.countries?.length){ html = renderEmpty(data.meta); }
      else{ html = renderRankList(Array.isArray(data.countries)?data.countries:[data.top_story], `Score ≥ ${intent.value}`); html += renderSourcesMini(data.meta.sources); }
      tag = `score ≥ ${intent.value} · ${Date.now()-t0}ms`;
    }

    // ── Trend ──
    else if(intent.type === 'trend'){
      const data = await callAPI({ top: 20 });
      const filtered = (data.countries||[]).filter(c => c.trend?.direction === intent.direction);
      if(!filtered.length){ html = renderEmpty({message:`No countries currently show a live ${intent.direction} trend.`}); }
      else{ html = renderRankList(filtered, `${filtered.length} countries ${intent.direction}`); }
      tag = `${intent.direction} · ${Date.now()-t0}ms`;
    }

    // ── Anomalies ──
    else if(intent.type === 'anomalies'){
      const data = await callAPI({ top: 30 });
      const filtered = (data.countries||[]).filter(c => c.anomaly?.detected);
      if(!filtered.length){ html = renderEmpty({message:'No statistically significant anomalies detected right now.'}); }
      else{ html = renderRankList(filtered, `🚨 ${filtered.length} active anomalies`); }
      tag = `anomalies · ${Date.now()-t0}ms`;
    }

    // ── Search (single country) ──
    else if(intent.type === 'search'){
      const data = await callAPI({ q: intent.query });
      if(data.meta.mode === 'empty'){ html = renderEmpty(data.meta); }
      else{
        html = renderStoryCard(data.top_story, `evid-${++msgCount}`);
        html += renderSourcesMini(data.meta.sources);
        // Show ML stats if available
        if(data.meta.enhancements?.machine_learning){
          const ml = data.meta.enhancements.machine_learning;
          html += `<div style="font-family:var(--fm);font-size:8px;color:var(--td);margin-top:4px;">
            🧠 ML: ${ml.trained ? `${(ml.performance.r2*100).toFixed(0)}% accuracy` : 'training...'} · ${ml.training_count} samples</div>`;
        }
      }
      tag = `${esc(intent.query)} · ${Date.now()-t0}ms`;
    }

    else {
      html = renderErrorMsg('I didn\'t understand that. Try "top 5", "Somalia", or "compare Sudan and Yemen".');
      tag = 'unknown intent';
    }

    typingRow.remove();
    addBotHTML(html, tag);

  }catch(err){
    typingRow.remove();
    addBotHTML(renderErrorMsg(err.message || 'Something went wrong reaching the live feed.'), 'error');
  }
}

function sendMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if(!text) return;
  ask(text);
}

// ── Boot ──
clearChat();

// ── Keyboard shortcut: Ctrl+Enter to send ──
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    sendMessage();
  }
});
