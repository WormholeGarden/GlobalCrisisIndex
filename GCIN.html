<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Story — Live Crisis Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#030b18;--surface:#081829;--glass:rgba(5,15,34,.97);
  --cyan:#00c8ff;--cyan2:rgba(0,200,255,.1);--cyan3:rgba(0,200,255,.25);
  --rose:#ff375f;--amber:#ffb020;--green:#00e5a0;--purple:#bf7fff;--orange:#ff8c42;
  --tp:#ddeeff;--ts:#8bbdd8;--tm:#4a7a9b;--td:#1e3d58;
  --b1:rgba(0,200,255,.06);--b2:rgba(0,200,255,.12);--b3:rgba(0,200,255,.22);
  --fd:'Barlow Condensed',sans-serif;--fb:'Barlow',sans-serif;--fm:'JetBrains Mono',monospace;
  --r1:4px;--r2:8px;--r3:12px;--r4:18px;--ease:cubic-bezier(.4,0,.2,1)
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--void);color:var(--tp);font-family:var(--fb);min-height:100vh;line-height:1.5}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(0,200,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,255,.03) 1px,transparent 1px);
  background-size:64px 64px;opacity:.6}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:99px}

/* ── HEADER / CONTROLS ── */
.topbar{position:relative;z-index:2;background:rgba(3,11,24,.98);backdrop-filter:blur(24px);
  border-bottom:1px solid var(--b1);padding:14px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.brand-mark{width:30px;height:30px;border-radius:7px;background:linear-gradient(145deg,rgba(0,200,255,.2),rgba(191,127,255,.15));
  border:1px solid rgba(0,200,255,.3);display:flex;align-items:center;justify-content:center;font-size:14px}
.brand-name{font-family:var(--fd);font-size:17px;font-weight:800;letter-spacing:-.01em;
  background:linear-gradient(135deg,#fff 30%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand-sub{font-family:var(--fm);font-size:8px;color:var(--tm);letter-spacing:.14em;text-transform:uppercase}
.ctrl-group{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.02);border:1px solid var(--b1);border-radius:99px;padding:3px}
.ctrl-btn{font-family:var(--fm);font-size:10px;padding:6px 14px;border-radius:99px;background:transparent;border:none;color:var(--tm);cursor:pointer;transition:all .15s;white-space:nowrap}
.ctrl-btn.on{background:var(--cyan2);color:var(--cyan)}
.ctrl-btn:hover:not(.on){color:var(--ts)}
.search-box{flex:1;min-width:180px;max-width:320px;background:rgba(255,255,255,.03);border:1px solid var(--b1);border-radius:99px;
  padding:8px 16px;font-family:var(--fb);font-size:12px;color:var(--tp);outline:none;transition:all .15s}
.search-box:focus{border-color:var(--b3);background:var(--cyan2)}
.search-box::placeholder{color:var(--td)}
.live-pill{display:flex;align-items:center;gap:5px;background:rgba(0,200,255,.06);border:1px solid rgba(0,200,255,.18);
  border-radius:99px;padding:5px 12px;font-family:var(--fm);font-size:9px;color:var(--cyan);letter-spacing:.06em;flex-shrink:0}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,200,255,.6)}50%{opacity:.5;box-shadow:0 0 0 5px transparent}}
.refresh-btn{font-family:var(--fm);font-size:10px;background:var(--cyan2);border:1px solid var(--b3);color:var(--cyan);
  padding:7px 14px;border-radius:99px;cursor:pointer;transition:all .15s;flex-shrink:0}
.refresh-btn:hover{background:rgba(0,200,255,.18)}
.refresh-btn:disabled{opacity:.4;cursor:not-allowed}

/* ── LAYOUT ── */
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:28px 20px 80px}
.meta-strip{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.meta-chip{font-family:var(--fm);font-size:9px;color:var(--tm);background:rgba(255,255,255,.02);
  border:1px solid var(--b1);border-radius:99px;padding:5px 12px;display:flex;align-items:center;gap:6px}
.meta-chip b{color:var(--ts);font-weight:700}
.meta-chip.warn{color:var(--amber);border-color:rgba(255,176,32,.2);background:rgba(255,176,32,.05)}

/* ── STATE PANELS ── */
.state-panel{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:70px 24px;gap:14px;animation:fi .3s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.state-icon{font-size:36px;opacity:.7}
.state-title{font-family:var(--fd);font-size:20px;font-weight:800;color:var(--ts)}
.state-sub{font-family:var(--fm);font-size:11px;color:var(--tm);max-width:460px;line-height:1.8}
.spin-ring{width:34px;height:34px;border:2.5px solid rgba(0,200,255,.1);border-top-color:var(--cyan);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.empty-badge{font-family:var(--fm);font-size:9px;background:rgba(0,229,160,.08);border:1px solid rgba(0,229,160,.2);
  color:var(--green);border-radius:99px;padding:5px 14px;margin-top:4px}

/* ── STORY CARD ── */
.story-card{background:var(--glass);border:1px solid var(--b1);border-radius:var(--r4);overflow:hidden;
  margin-bottom:16px;animation:fi .3s ease both;transition:border-color .2s}
.story-card:hover{border-color:var(--b2)}
.story-head{padding:20px 22px;display:flex;align-items:flex-start;gap:16px;border-bottom:1px solid var(--b1)}
.story-flag{font-size:36px;line-height:1;flex-shrink:0}
.story-title-block{flex:1;min-width:0}
.story-name{font-family:var(--fd);font-size:24px;font-weight:900;letter-spacing:-.01em;
  background:linear-gradient(135deg,#fff 20%,var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.story-meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.sev-badge{font-family:var(--fm);font-size:9px;font-weight:800;padding:3px 10px;border-radius:99px;letter-spacing:.05em}
.rank-tag{font-family:var(--fm);font-size:9px;color:var(--tm)}
.score-ring-wrap{position:relative;flex-shrink:0;width:64px;height:64px}
.score-ring-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:19px;font-weight:900}
.ring-lbl{position:absolute;bottom:2px;left:0;right:0;text-align:center;font-family:var(--fm);font-size:6.5px;color:var(--tm)}

.story-body{padding:18px 22px}
.crisis-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.crisis-tag{font-family:var(--fm);font-size:9px;background:rgba(255,255,255,.04);border:1px solid var(--b2);
  border-radius:4px;padding:4px 9px;color:var(--ts)}

.trend-row{display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.trend-item{display:flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10px;color:var(--tm)}
.trend-val{font-weight:700}
.trend-val.up{color:var(--rose)}.trend-val.down{color:var(--green)}.trend-val.flat{color:var(--ts)}

.anomaly-box{background:rgba(255,55,95,.06);border:1px solid rgba(255,55,95,.18);border-radius:var(--r2);
  padding:10px 13px;margin-bottom:16px;display:flex;align-items:flex-start;gap:9px}
.anomaly-box.watch{background:rgba(255,176,32,.05);border-color:rgba(255,176,32,.15)}
.anomaly-icon{font-size:15px;flex-shrink:0}
.anomaly-text{font-family:var(--fm);font-size:10px;color:var(--ts);line-height:1.6}
.anomaly-text b{color:var(--rose)}
.anomaly-box.watch .anomaly-text b{color:var(--amber)}

/* Evidence Ledger */
.evid-box{background:rgba(255,255,255,.01);border:1px solid var(--b1);border-radius:var(--r3);overflow:hidden;margin-bottom:16px}
.evid-head{padding:10px 13px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;
  cursor:pointer;user-select:none}
.evid-title{font-family:var(--fm);font-size:9px;letter-spacing:.12em;color:var(--tm);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.evid-count{font-family:var(--fm);font-size:9px;background:rgba(0,200,255,.08);border:1px solid rgba(0,200,255,.2);
  color:var(--cyan);border-radius:99px;padding:2px 8px}
.evid-list{display:flex;flex-direction:column}
.evid-row{display:flex;align-items:flex-start;gap:9px;padding:9px 13px;border-bottom:1px solid rgba(255,255,255,.02)}
.evid-row:last-child{border-bottom:none}
.evid-src-badge{font-family:var(--fm);font-size:7.5px;font-weight:700;padding:2px 7px;border-radius:3px;flex-shrink:0;
  white-space:nowrap;background:rgba(0,200,255,.08);border:1px solid rgba(0,200,255,.18);color:var(--cyan)}
.evid-detail{flex:1;font-size:11px;color:var(--ts);line-height:1.5}
.evid-delta{font-family:var(--fm);font-size:9px;font-weight:700;color:var(--rose);flex-shrink:0}

/* Dimensions */
.dims-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-bottom:16px}
.dim-row{display:flex;align-items:center;gap:8px}
.dim-lbl{font-family:var(--fm);font-size:9px;color:var(--tm);width:78px;flex-shrink:0}
.dim-track{flex:1;height:4px;background:rgba(255,255,255,.04);border-radius:99px;overflow:hidden}
.dim-fill{height:100%;border-radius:99px;transition:width .8s var(--ease)}
.dim-val{font-family:var(--fm);font-size:9px;color:var(--ts);width:20px;text-align:right;flex-shrink:0}

/* Recommendation */
.rec-box{border-radius:var(--r2);padding:11px 14px;font-family:var(--fm);font-size:11px;line-height:1.6;margin-bottom:4px}
.rec-box.IMMEDIATE{background:rgba(255,55,95,.1);border:1px solid rgba(255,55,95,.25);color:#ff8fa3}
.rec-box.URGENT{background:rgba(255,140,66,.08);border:1px solid rgba(255,140,66,.2);color:#ffb37a}
.rec-box.HIGH{background:rgba(255,176,32,.07);border:1px solid rgba(255,176,32,.18);color:#ffd27a}
.rec-box.MONITOR,.rec-box.WATCH{background:rgba(0,229,160,.05);border:1px solid rgba(0,229,160,.14);color:var(--green)}
.rec-tier{font-weight:800;letter-spacing:.05em;margin-right:6px}

.story-footer{display:flex;flex-wrap:wrap;gap:8px;padding:14px 22px;border-top:1px solid var(--b1);background:rgba(255,255,255,.008)}
.footer-src{font-family:var(--fm);font-size:8px;color:var(--td);background:rgba(255,255,255,.02);border:1px solid var(--b1);
  border-radius:3px;padding:2px 6px}

/* Comparison mode */
.compare-verdict{font-family:var(--fm);font-size:12px;color:var(--purple);background:rgba(191,127,255,.06);
  border:1px solid rgba(191,127,255,.2);border-radius:var(--r2);padding:12px 16px;margin-bottom:16px}

/* Sources health strip */
.sources-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:24px;padding-top:18px;border-top:1px solid var(--b1)}
.src-tag{font-family:var(--fm);font-size:8.5px;padding:4px 10px;border-radius:99px;display:flex;align-items:center;gap:5px}
.src-tag.live{background:rgba(0,229,160,.06);border:1px solid rgba(0,229,160,.18);color:var(--green)}
.src-tag.dead{background:rgba(255,55,95,.05);border:1px solid rgba(255,55,95,.15);color:var(--rose);opacity:.7}
.src-dot{width:5px;height:5px;border-radius:50%}
.src-dot.live{background:var(--green)}
.src-dot.dead{background:var(--rose)}

@media(max-width:600px){
  .dims-grid{grid-template-columns:1fr}
  .topbar{padding:12px 14px}
  .wrap{padding:20px 14px 60px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark">📡</div>
    <div>
      <div class="brand-name">Top Story</div>
      <div class="brand-sub">Live Crisis Feed</div>
    </div>
  </div>
  <div class="ctrl-group" id="modeGroup">
    <button class="ctrl-btn on" data-mode="single">Top Story</button>
    <button class="ctrl-btn" data-mode="top5">Top 5</button>
    <button class="ctrl-btn" data-mode="top10">Top 10</button>
  </div>
  <input class="search-box" id="searchInput" placeholder="Search a country, e.g. Somalia, YEM…" onkeypress="if(event.key==='Enter')doSearch()">
  <div class="live-pill"><div class="live-dot"></div>LIVE</div>
  <button class="refresh-btn" id="refreshBtn" onclick="loadFeed(currentParams)">⟳ Refresh</button>
</div>

<div class="wrap">
  <div class="meta-strip" id="metaStrip"></div>
  <div id="content">
    <div class="state-panel">
      <div class="spin-ring"></div>
      <div class="state-title">Loading live crisis data…</div>
      <div class="state-sub">Querying USGS, EMSC, NASA, GDACS, IFRC, Open-Meteo, disease.sh, World Bank, and UNHCR.</div>
    </div>
  </div>
  <div class="sources-strip" id="sourcesStrip"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════
// CONFIG — point this at your deployed top-story.js endpoint
// ══════════════════════════════════════════════════════════════════════
const API_BASE = "/api/top-story";

let currentParams = { top: 1 };

// ── Helpers ──
const esc = s => String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function sevColor(sev){
  return { CATASTROPHIC:"#ff375f", CRITICAL:"#ff5f7a", HIGH:"#ff8c42", ELEVATED:"#ffb020", MODERATE:"#3ec5ff" }[sev] || "#3ec5ff";
}
function dimColor(v){ return v>=75?"#ff375f":v>=55?"#ff8c42":v>=35?"#ffb020":"#3ec5ff"; }
function fmtDate(iso){
  try{ return new Date(iso).toLocaleString([], {month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}); }
  catch(e){ return "—"; }
}

// ── Mode buttons ──
document.querySelectorAll('#modeGroup .ctrl-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#modeGroup .ctrl-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    const mode = btn.dataset.mode;
    const params = mode==='single' ? {top:1} : mode==='top5' ? {top:5} : {top:10};
    loadFeed(params);
  });
});

function doSearch(){
  const q = document.getElementById('searchInput').value.trim();
  if(!q) return;
  document.querySelectorAll('#modeGroup .ctrl-btn').forEach(b=>b.classList.remove('on'));
  loadFeed({ q });
}

// ── Main loader ──
async function loadFeed(params){
  currentParams = params;
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '⟳ Loading…';
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="state-panel">
      <div class="spin-ring"></div>
      <div class="state-title">Loading live crisis data…</div>
      <div class="state-sub">Querying USGS, EMSC, NASA, GDACS, IFRC, Open-Meteo, disease.sh, World Bank, and UNHCR.</div>
    </div>`;

  try{
    const url = new URL(API_BASE, window.location.origin);
    Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
    const res = await fetch(url.toString());
    const data = await res.json();

    if(!res.ok){
      renderError(data.error || `HTTP ${res.status}`, data.available);
      return;
    }
    renderMeta(data.meta);
    renderSources(data.meta?.sources);

    if(data.meta?.mode === 'empty' || (!data.top_story && !data.countries?.length)){
      renderEmpty(data.meta);
      return;
    }
    if(data.meta.mode === 'single'){
      content.innerHTML = renderStoryCard(data.top_story);
      wireEvidenceToggles();
    } else if(data.meta.mode === 'list'){
      content.innerHTML = data.countries.map(renderStoryCard).join('');
      wireEvidenceToggles();
    } else if(data.meta.mode === 'comparison'){
      let html = `<div class="compare-verdict">⚖️ ${esc(data.comparison.verdict)}</div>`;
      html += data.countries.map(renderStoryCard).join('');
      content.innerHTML = html;
      wireEvidenceToggles();
    }
  }catch(err){
    renderError('Network error — could not reach the Top Story API. ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = '⟳ Refresh';
  }
}

// ── Renderers ──
function renderMeta(meta){
  if(!meta) return;
  const el = document.getElementById('metaStrip');
  const parts = [
    `<div class="meta-chip">🌍 <b>${meta.countries_tracked}</b> countries tracked</div>`,
    `<div class="meta-chip">📡 <b>${meta.data_policy?.countries_with_live_evidence ?? '—'}</b> with live evidence</div>`,
    `<div class="meta-chip">⚡ <b>${meta.anomalies_detected}</b> anomalies detected</div>`,
    `<div class="meta-chip">🕐 next update ${fmtDate(meta.next_update)}</div>`,
  ];
  if(meta.data_policy?.no_fallbacks){
    parts.push(`<div class="meta-chip warn">✓ 100% live data — no fabricated fallback stories</div>`);
  }
  el.innerHTML = parts.join('');
}

function renderSources(sources){
  const el = document.getElementById('sourcesStrip');
  if(!sources){ el.innerHTML=''; return; }
  const rows = [];
  const flat = {
    'USGS': sources.usgs?.live, 'EMSC': sources.emsc?.live, 'NASA': sources.nasa?.live,
    'GDACS': sources.gdacs?.live, 'IFRC': sources.ifrc?.live, 'Open-Meteo Heat': sources.heat?.live,
    'Open-Meteo Hazards': sources.hazards?.live, 'Air Quality': sources.aq?.live, 'NOAA': sources.noaa?.live,
    'disease.sh': sources.disease?.live, 'WB Population': sources.wb?.population, 'WB Inflation': sources.wb?.inflation,
    'WB GDP': sources.wb?.gdp_growth, 'WB Unemployment': sources.wb?.unemployment, 'WB Refugees': sources.wb?.refugees,
    'UNHCR': sources.unhcr?.live,
  };
  Object.entries(flat).forEach(([label, live])=>{
    rows.push(`<div class="src-tag ${live?'live':'dead'}"><div class="src-dot ${live?'live':'dead'}"></div>${label}</div>`);
  });
  el.innerHTML = rows.join('');
}

function renderError(msg, available){
  document.getElementById('content').innerHTML = `
    <div class="state-panel">
      <div class="state-icon">⚠️</div>
      <div class="state-title" style="color:var(--rose)">Could not load feed</div>
      <div class="state-sub">${esc(msg)}</div>
      ${available ? `<div class="state-sub" style="max-width:600px">${available.slice(0,20).map(esc).join(' · ')}</div>` : ''}
    </div>`;
}

function renderEmpty(meta){
  document.getElementById('content').innerHTML = `
    <div class="state-panel">
      <div class="state-icon">🔍</div>
      <div class="state-title">No live-evidence stories right now</div>
      <div class="state-sub">${esc(meta?.message || 'No countries in this scope currently have live evidence from any tracked source.')}</div>
      <div class="empty-badge">This is intentional — the feed never fabricates a placeholder story</div>
    </div>`;
}

function renderStoryCard(c){
  const sevCol = sevColor(c.severity);
  const trendDir = c.trend?.direction;
  const trendClass = trendDir==='escalating' ? 'up' : trendDir==='improving' ? 'down' : 'flat';
  const trendArrow = trendDir==='escalating' ? '▲' : trendDir==='improving' ? '▼' : '→';
  const cir = 175.9;
  const dash = (c.score/100*cir).toFixed(1);

  // Evidence ledger rows — built from live_evidence + score_audit.adjustments
  const adjustments = c.score_audit?.adjustments || [];
  const evidRows = adjustments.length ? adjustments.map(a => `
    <div class="evid-row">
      <span class="evid-src-badge">${esc(a.source)}</span>
      <span class="evid-detail">${esc(a.reason)} <span style="color:var(--tm)">→ ${esc(a.field)}</span></span>
      <span class="evid-delta">+${a.delta}</span>
    </div>`).join('') : `<div class="evid-row"><span class="evid-detail" style="color:var(--td)">No scoring adjustments recorded this cycle — score reflects structural baseline only.</span></div>`;

  const dimRows = Object.entries(c.dimensions||{}).map(([k,d])=>{
    const col = dimColor(d.value);
    return `<div class="dim-row">
      <span class="dim-lbl">${esc(d.label)}</span>
      <div class="dim-track"><div class="dim-fill" style="width:${d.value}%;background:${col}"></div></div>
      <span class="dim-val">${d.value}</span>
    </div>`;
  }).join('');

  const crisisTags = (c.crisis_types||[]).map(t => `<span class="crisis-tag">${t.icon} ${esc(t.label)}</span>`).join('');

  const anomBox = c.anomaly?.detected ? `
    <div class="anomaly-box">
      <span class="anomaly-icon">🚨</span>
      <span class="anomaly-text"><b>${esc(c.anomaly.severity)} anomaly detected</b> — ${esc(c.anomaly.note)}</span>
    </div>` : (c.anomaly?.methods_fired===1 ? `
    <div class="anomaly-box watch">
      <span class="anomaly-icon">👁</span>
      <span class="anomaly-text"><b>Weak signal</b> — ${esc(c.anomaly.note)}</span>
    </div>` : '');

  const rec = c.recommendation || {};

  // Footer source badges from live_evidence_sources
  const footerSrcs = (c.live_evidence_sources||[]).map(s => `<span class="footer-src">${esc(s)}</span>`).join('');

  return `
  <div class="story-card">
    <div class="story-head">
      <div class="story-flag">${c.flag}</div>
      <div class="story-title-block">
        <div class="story-name">${esc(c.name)}</div>
        <div class="story-meta-row">
          <span class="sev-badge" style="background:${sevCol}18;color:${sevCol};border:1px solid ${sevCol}44">${esc(c.severity)}</span>
          <span class="rank-tag">#${c.rank} of ${c.total_countries} · top ${100-c.percentile}%</span>
          <span class="rank-tag">${c.live_evidence_count} live source${c.live_evidence_count===1?'':'s'}</span>
        </div>
      </div>
      <div class="score-ring-wrap">
        <svg width="64" height="64" viewBox="0 0 68 68">
          <circle cx="34" cy="34" r="28" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="3.5"/>
          <circle cx="34" cy="34" r="28" fill="none" stroke="${sevCol}" stroke-width="3.5" stroke-linecap="round"
            stroke-dasharray="${dash} ${cir}" transform="rotate(-90 34 34)"/>
        </svg>
        <div class="score-ring-val" style="color:${sevCol}">${c.score}</div>
        <div class="ring-lbl">/100</div>
      </div>
    </div>

    <div class="story-body">
      <div class="crisis-tags">${crisisTags}</div>

      <div class="trend-row">
        <div class="trend-item">7d trend <span class="trend-val ${trendClass}">${trendArrow} ${c.trend?.delta_7d>0?'+':''}${c.trend?.delta_7d}</span></div>
        <div class="trend-item">7d forecast <span class="trend-val">${c.trend?.forecast_7d}/100</span></div>
        <div class="trend-item">prior baseline <span class="trend-val">${c.score_audit?.prior_score}</span></div>
        <div class="trend-item">live boost <span class="trend-val ${c.score_audit?.live_boost>0?'up':'flat'}">${c.score_audit?.live_boost>0?'+':''}${c.score_audit?.live_boost}</span></div>
      </div>

      ${anomBox}

      <div class="evid-box">
        <div class="evid-head" onclick="const l=this.nextElementSibling;const open=l.style.display!=='none';l.style.display=open?'none':'flex';">
          <span class="evid-title">🔎 Evidence Ledger</span>
          <span class="evid-count">${adjustments.length} adjustment${adjustments.length===1?'':'s'}</span>
        </div>
        <div class="evid-list" style="display:flex;flex-direction:column;">${evidRows}</div>
      </div>

      <div class="dims-grid">${dimRows}</div>

      <div class="rec-box ${rec.tier}">
        <span class="rec-tier">${esc(rec.tier)}:</span>${esc(rec.text)}
      </div>
    </div>

    <div class="story-footer">${footerSrcs || '<span class="footer-src">no live sources matched this cycle</span>'}</div>
  </div>`;
}

function wireEvidenceToggles(){
  // Evidence lists start expanded by default via inline style; toggle handled inline onclick above.
}

// ── Boot ──
loadFeed(currentParams);
</script>
</body>
</html>
